[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assistant"
version = "1.0.0"
description = "Sistema RAG con web scraping sobre el sitio institucional de BBVA Colombia"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dante Ospina" }]

dependencies = [
    # --- Configuración / núcleo ---
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",

    # --- Scraping ---
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "trafilatura>=1.12",
    "playwright>=1.49",

    # --- Indexación / RAG ---
    "qdrant-client>=1.12,<2",
    "fastembed>=0.4.2,<0.8",
    "openai>=1.55",

    # --- Persistencia ---
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",

    # --- API / CLI ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# La interfaz web ya no es Python: vive en `frontend/` (Next.js) y se construye
# con su propio Dockerfile. Aquí solo queda lo necesario para los scripts de
# verificación end-to-end.
scripts = ["requests>=2.32"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "respx>=0.21",
]

[project.scripts]
rag-assistant = "rag_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI/Typer usan llamadas en defaults por diseño

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
